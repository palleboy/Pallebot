name: PalleBot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pakker
        run: |
          pip install -r requirements.txt

      - name: Start PalleBot
        run: |
          python main.py
